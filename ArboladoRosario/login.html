<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso - SGP Parques y Paseos</title>
    
    <!-- Fuentes Modernas: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= ESTILOS GLOBALES & VARIABLES ================= */
        :root {
            --primary: #0F6E56;
            --primary-hover: #0a523f;
            --primary-light: #e6f2ef;
            
            --bg-color: #f8fafc; /* Gris muy claro azulado */
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            -webkit-font-smoothing: antialiased;
            /* Fondo sutilmente decorado */
            background-image: radial-gradient(circle at top right, #e6f2ef 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #eff6ff 0%, transparent 40%);
        }

        /* ================= ANIMACIONES ================= */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= CONTENEDOR Y TARJETA ================= */
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .card { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 40px 32px; 
            border: 1px solid var(--border-light); 
            box-shadow: var(--shadow-lg); 
        }

        /* ================= BRANDING ================= */
        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }
        
        .brand-icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: inline-block;
            background: var(--primary-light);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            color: var(--primary);
        }

        .brand-header h2 { 
            font-size: 22px; 
            font-weight: 800;
            color: var(--text-main); 
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        
        .brand-header p { 
            font-size: 14px; 
            font-weight: 500;
            color: var(--text-muted); 
        }

        /* ================= FORMULARIO ================= */
        .form-group { margin-bottom: 24px; }
        
        label { 
            display: block; 
            font-size: 13px; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 8px; 
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #94a3b8;
            font-size: 16px;
            transition: color 0.2s ease;
        }

        input[type="email"], input[type="text"], input[type="password"] {
            width: 100%; 
            padding: 14px 16px 14px 44px; /* Espacio para el ícono a la izquierda */
            border: 1.5px solid var(--border-light); 
            border-radius: var(--radius-md);
            font-size: 15px; 
            background: var(--surface);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-light);
        }

        /* Cambia el color del ícono cuando el input está en foco */
        input:focus + i, .input-wrapper:focus-within i {
            color: var(--primary);
        }
        
        /* ================= BOTÓN ================= */
        .btn { 
            padding: 16px 24px; 
            border: none; 
            border-radius: var(--radius-md); 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            text-align: center; 
            width: 100%;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        .btn-primary { 
            background-color: var(--primary); 
            color: white; 
            box-shadow: 0 4px 10px rgba(15, 110, 86, 0.2); 
        }
        
        .btn-primary:hover { 
            background-color: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(15, 110, 86, 0.3); 
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled { 
            opacity: 0.7; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        /* ================= FOOTER ================= */
        .system-info {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="card">
            
            <div class="brand-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-tree"></i>
                </div>
                <h2>Dirección de Arbolado</h2>
                <p>Municipalidad de Rosario</p>
            </div>

            <form id="login-form" onsubmit="procesarLogin(event)">
                <div class="form-group">
                    <label for="email">Correo Institucional / Legajo</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="email" placeholder="ejemplo@rosario.gob.ar" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña de acceso</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-submit">
                    <span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

        </div>
        
        <div class="system-info">
            SGP - Sistema de Gestión y Dictaminación v1.0<br>
            Uso exclusivo para personal técnico autorizado.
        </div>
    </div>

    <script>

            e.preventDefault(); 

            const btn = document.getElementById('btn-submit');
            
            // Estado de "Cargando"
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verificando credenciales...</span>';

            //     email: email,
            //     password: password,
            // });

            // if (error) {
            //     alert("Error al iniciar sesión: " + error.message);
            //     btn.disabled = false;
            //     btn.innerHTML = '<span>Ingresar al Sistema</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>';
            //     return;
            // }
            // =========================================================================

            // Simulación de validación en red
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        }
    </script>
</body>
</html>
