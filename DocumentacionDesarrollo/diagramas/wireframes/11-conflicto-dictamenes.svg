<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="375" height="812" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>
  <rect x="0" y="24" width="375" height="56" rx="0" fill="#2c3e50"/>
  <text x="20" y="58" font-size="16" fill="#fff" font-weight="bold">Dictámenes en conflicto</text>
  <text x="20" y="104" font-size="11" fill="#222" font-weight="bold">SUA 1234-2026 · Pendiente-revisión</text>
  <text x="20" y="120" font-size="9" fill="#666">Dos dictámenes firmados para el mismo caso. Elegí cuál queda vigente.</text>
  <rect x="12" y="134" width="351" height="124" rx="8" fill="#fff" stroke="#27ae60"/>
  <text x="24" y="156" font-size="12" fill="#222" font-weight="bold">Dictamen A</text>
  <text x="24" y="174" font-size="9" fill="#666">Firmado por jperez3 · 10/10/2026 · 16:20 (sin señal)</text>
  <text x="24" y="190" font-size="9" fill="#666">Intervención: Poda · Reducción de altura de copa</text>
  <text x="24" y="206" font-size="9" fill="#666">Prioridad: Media</text>
  <rect x="24" y="220" width="18" height="18" rx="9" fill="#27ae60" stroke="#999"/>
  <text x="52" y="233" font-size="10" fill="#444">Dejar vigente este dictamen</text>
  <rect x="12" y="268" width="351" height="124" rx="8" fill="#fff" stroke="#ddd"/>
  <text x="24" y="290" font-size="12" fill="#222" font-weight="bold">Dictamen B</text>
  <text x="24" y="308" font-size="9" fill="#666">Firmado por rlopez2 · 10/10/2026 · 15:05</text>
  <text x="24" y="324" font-size="9" fill="#666">Intervención: Extracción · Con riesgo de caída por inclinación</text>
  <text x="24" y="340" font-size="9" fill="#666">Prioridad: Alta</text>
  <rect x="24" y="354" width="18" height="18" rx="9" fill="#fff" stroke="#999"/>
  <text x="52" y="367" font-size="10" fill="#444">Dejar vigente este dictamen</text>
  <rect x="0" y="0" width="375" height="812" rx="0" fill="#000000" opacity="0.35"/>
  <rect x="20" y="420" width="335" height="230" rx="12" fill="#fff"/>
  <text x="187" y="455" font-size="14" fill="#222" font-weight="bold" text-anchor="middle">Confirmar elección</text>
  <text x="187" y="490" font-size="10" fill="#555" text-anchor="middle">Queda vigente el Dictamen A.</text>
  <text x="187" y="507" font-size="10" fill="#555" text-anchor="middle">El Dictamen B queda en el historial</text>
  <text x="187" y="524" font-size="10" fill="#555" text-anchor="middle">como no vigente. Se registra quién eligió,</text>
  <text x="187" y="541" font-size="10" fill="#555" text-anchor="middle">la fecha y la hora (RF-59).</text>
  <rect x="40" y="580" width="140" height="42" rx="8" fill="#fff" stroke="#999"/>
  <text x="110" y="606" font-size="11" fill="#555" text-anchor="middle">Cancelar</text>
  <rect x="195" y="580" width="140" height="42" rx="8" fill="#27ae60"/>
  <text x="265" y="606" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Confirmar</text>
</svg>
