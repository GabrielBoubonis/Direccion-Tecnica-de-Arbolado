<svg viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="375" height="812" fill="#ffffff"/>
  <rect width="375" height="24" fill="#eeeeee"/>

  <!-- header -->
  <rect x="0" y="24" width="375" height="56" fill="#2c3e50"/>
  <text x="20" y="58" font-size="16" fill="#ffffff" font-weight="bold">Auditoría</text>

  <!-- filtros (barra colapsable) -->
  <rect x="12" y="94" width="351" height="34" rx="8" fill="#f0f0f0"/>
  <text x="24" y="116" font-size="10" fill="#555">Filtros ▾  (usuario, acción, rango de fechas)</text>

  <rect x="12" y="136" width="110" height="28" rx="6" fill="#ffffff" stroke="#ccc"/>
  <text x="67" y="154" font-size="9" fill="#888" text-anchor="middle">Usuario</text>
  <rect x="130" y="136" width="110" height="28" rx="6" fill="#ffffff" stroke="#ccc"/>
  <text x="185" y="154" font-size="9" fill="#888" text-anchor="middle">Tipo de acción</text>
  <rect x="248" y="136" width="115" height="28" rx="6" fill="#ffffff" stroke="#ccc"/>
  <text x="305" y="154" font-size="9" fill="#888" text-anchor="middle">Rango de fechas</text>

  <!-- listado de eventos: tabla con paginación (mismo patrón que Gestión de usuarios) -->
  <text x="24" y="192" font-size="11" fill="#888">Mostrando 1-20 de 47 eventos · más recientes primero</text>

  <!-- evento 1 -->
  <rect x="12" y="204" width="351" height="64" rx="8" fill="#ffffff" stroke="#ddd"/>
  <text x="24" y="224" font-size="11" font-weight="bold" fill="#222">mgomez1</text>
  <rect x="24" y="230" width="140" height="16" rx="8" fill="#fdebd0"/>
  <text x="94" y="242" font-size="8" fill="#9c640c" text-anchor="middle">Cambio de rol</text>
  <text x="24" y="258" font-size="9" fill="#999">02/10/2026 · 14:32</text>
  <text x="260" y="258" font-size="9" fill="#999" text-anchor="end">afectado: jperez3</text>

  <!-- evento 2 -->
  <rect x="12" y="276" width="351" height="64" rx="8" fill="#ffffff" stroke="#ddd"/>
  <text x="24" y="296" font-size="11" font-weight="bold" fill="#222">mgomez1</text>
  <rect x="24" y="302" width="100" height="16" rx="8" fill="#d6eaf8"/>
  <text x="74" y="314" font-size="8" fill="#1b4f72" text-anchor="middle">Alta de usuario</text>
  <text x="24" y="330" font-size="9" fill="#999">01/10/2026 · 09:05</text>
  <text x="260" y="330" font-size="9" fill="#999" text-anchor="end">afectado: rlopez2</text>

  <!-- evento 3 -->
  <rect x="12" y="348" width="351" height="64" rx="8" fill="#ffffff" stroke="#ddd"/>
  <text x="24" y="368" font-size="11" font-weight="bold" fill="#222">mgomez1</text>
  <rect x="24" y="374" width="170" height="16" rx="8" fill="#eaf2e3"/>
  <text x="109" y="386" font-size="8" fill="#386641" text-anchor="middle">Reconfiguración de criterios de ruteo</text>
  <text x="24" y="402" font-size="9" fill="#999">29/09/2026 · 17:48</text>

  <!-- evento 4 (baja) -->
  <rect x="12" y="420" width="351" height="64" rx="8" fill="#ffffff" stroke="#ddd"/>
  <text x="24" y="440" font-size="11" font-weight="bold" fill="#222">mgomez1</text>
  <rect x="24" y="446" width="100" height="16" rx="8" fill="#fadbd8"/>
  <text x="74" y="458" font-size="8" fill="#922b21" text-anchor="middle">Baja de usuario</text>
  <text x="24" y="474" font-size="9" fill="#999">28/09/2026 · 11:20</text>
  <text x="260" y="474" font-size="9" fill="#999" text-anchor="end">afectado: tfigue4</text>

  <!-- nota: sin edición/borrado -->
  <rect x="12" y="500" width="351" height="44" rx="8" fill="#f4f4f4"/>
  <text x="24" y="518" font-size="9" fill="#777">🔒 Registro inmutable: ningún evento de esta lista puede</text>
  <text x="24" y="530" font-size="9" fill="#777">editarse ni eliminarse desde la aplicación (RF-54).</text>

  <!-- paginación -->
  <rect x="24" y="560" width="327" height="36" rx="8" fill="#ffffff" stroke="#ddd"/>
  <text x="187" y="582" font-size="10" fill="#555" text-anchor="middle">‹  Página 1 de 3  ›</text>

  <!-- estado vacío (ejemplo alternativo, referencia textual) -->
  <text x="24" y="630" font-size="9" fill="#aaa" font-style="italic">Si el filtro aplicado no devuelve eventos, este listado se</text>
  <text x="24" y="642" font-size="9" fill="#aaa" font-style="italic">reemplaza por un mensaje "No hay eventos para este filtro"</text>
  <text x="24" y="654" font-size="9" fill="#aaa" font-style="italic">en vez de una tabla vacía sin explicación (CU-13, excepción E1).</text>
</svg>
