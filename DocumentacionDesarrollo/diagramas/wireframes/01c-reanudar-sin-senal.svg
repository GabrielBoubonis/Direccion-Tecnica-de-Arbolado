  <rect x="30" y="410" width="315" height="46" rx="8" fill="#27ae60"/>
  <text x="187" y="438" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">REANUDAR SESIÓN</text>
  <text x="30" y="500" font-size="10" fill="#666">Se puede reanudar solo si:</text>
  <text x="30" y="515" font-size="10" fill="#666">• ingresaste hoy con conexión,</text>
  <text x="30" y="530" font-size="10" fill="#666">• no pasaron 7 días desde tu primer ingreso,</text>
  <text x="30" y="545" font-size="10" fill="#666">• el captor no fue revocado.</text>
  <text x="30" y="560" font-size="10" fill="#666">Cuando vuelva la señal, se revalida tu usuario.</text>
  <rect x="30" y="600" width="315" height="52" rx="8" fill="#fadbd8"/>
  <text x="42" y="622" font-size="10" fill="#922b21" font-weight="bold">Si no se cumple alguna condición:</text>
  <text x="42" y="640" font-size="10" fill="#922b21">"Necesitás señal para volver a ingresar."</text>
  <text x="187" y="780" font-size="8" fill="#aaa" text-anchor="middle">RF-57 · CU-01, excepción E3 · los intentos fallidos suman al bloqueo (RF-52)</text>
