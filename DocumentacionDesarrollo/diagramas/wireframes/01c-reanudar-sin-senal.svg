  <text x="187" y="200" font-size="15" fill="#222" font-weight="bold" text-anchor="middle">Tu sesión se cerró por inactividad</text>
  <text x="187" y="222" font-size="11" fill="#555" text-anchor="middle">Podés reanudarla sin señal con tu contraseña.</text>
  <text x="30" y="265" font-size="11" fill="#444">Usuario</text>
